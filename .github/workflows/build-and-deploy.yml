name: Build and Deploy Docusaurus Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (latest, v0.2.23, etc.)'
        required: false
        default: 'latest'
        type: string
      action:
        description: 'Action to perform'
        required: false
        default: 'build-and-deploy'
        type: choice
        options:
          - build-only
          - deploy-only
          - build-and-deploy

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.event.inputs.action != 'deploy-only' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clone llama-stack repository
      run: |
        echo "Cloning llama-stack repository..."
        TEMP_DIR=$(mktemp -d)
        echo "TEMP_DIR=$TEMP_DIR" >> $GITHUB_ENV

        git clone https://github.com/llamastack/llama-stack.git "$TEMP_DIR/llama-stack"
        cd "$TEMP_DIR/llama-stack"
        git fetch --all --tags

        # Determine version to checkout
        VERSION="${{ github.event.inputs.version }}"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          git checkout main
          echo "Using main branch (latest)"
          echo "BUILDING_LATEST=true" >> $GITHUB_ENV
          echo "VERSION_TAG=latest" >> $GITHUB_ENV
        else
          git checkout "$VERSION"
          echo "Using tag: $VERSION"
          echo "BUILDING_LATEST=false" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and setup versioning
      run: |
        echo "Installing dependencies..."
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"
        npm ci
        echo "Dependencies installed"

        echo "Setting up versioning configuration..."

        # Copy persistent versionsArchived.json from repo
        cp "${{ github.workspace }}/versionsArchived.json" ./

        # Archive-once-built: only keep the latest version in versions.json for building.
        # All older versions are pre-built and stored in versioned_docs/ already.
        # We use an empty versions.json for the build so Docusaurus only compiles
        # the current docs (and the single new version if building a tagged release).
        echo "[]" > versions.json
        echo "Using empty versions.json for build (archive-once-built)"

        # Patch Docusaurus config for versioning
        node << 'EOF'
        const fs = require('fs');

        let config = fs.readFileSync('docusaurus.config.ts', 'utf8');

        // Add versioning imports after OpenAPI import
        const versioningImports = `
        // Import fs for versioning configuration
        const fs = require('fs');

        // Versioning configuration for llamastack.github.io
        const versionsArchived = (() => {
          try {
            return JSON.parse(fs.readFileSync('./versionsArchived.json', 'utf8'));
          } catch (e) {
            console.warn('Could not load versionsArchived.json:', e);
            return {};
          }
        })();

        const archivedVersionsDropdownItems = Object.entries(versionsArchived).map(
          ([versionName, versionUrl]) => ({
            label: versionName,
            href: versionUrl,
          })
        );
        `;

        config = config.replace(
          /import type \* as OpenApiPlugin from "docusaurus-plugin-openapi-docs";/,
          `import type * as OpenApiPlugin from "docusaurus-plugin-openapi-docs";

        ${versioningImports}`
        );

        // Add version dropdown to navbar (replace GitHub item)
        const versionDropdown = `        {
          href: 'https://github.com/llamastack/llama-stack',
          label: 'GitHub',
          position: 'right',
        },
        {
          type: 'docsVersionDropdown',
          position: 'right',
          dropdownItemsAfter: archivedVersionsDropdownItems.length > 0 ? [
            {
              type: 'html',
              value: '<hr class="dropdown-separator">',
            },
            {
              type: 'html',
              className: 'dropdown-archived-versions',
              value: '<b>Previous versions</b>',
            },
            ...archivedVersionsDropdownItems,
          ] : [],
        },`;

        config = config.replace(
          /\s*{\s*href:\s*'https:\/\/github\.com\/llamastack\/llama-stack',\s*label:\s*'GitHub',\s*position:\s*'right',\s*},/,
          versionDropdown
        );

        // Fix blog include pattern to support both .md and .mdx
        config = config.replace(
          /include:\s*\['\*\.md'\]/g,
          "include: ['*.{md,mdx}']"
        );

        fs.writeFileSync('docusaurus.config.ts', config);
        console.log('Configuration patched');
        EOF

        echo "Configuration patches applied"

    - name: Import existing versioning artifacts
      run: |
        echo "Importing existing versioning artifacts from repository..."
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Copy existing versioned_docs if they exist
        if [ -d "${{ github.workspace }}/versioned_docs" ]; then
          cp -r "${{ github.workspace }}/versioned_docs" ./
          echo "Imported existing versioned_docs"
        fi

        # Copy existing versioned_sidebars if they exist
        if [ -d "${{ github.workspace }}/versioned_sidebars" ]; then
          cp -r "${{ github.workspace }}/versioned_sidebars" ./
          echo "Imported existing versioned_sidebars"
        fi

        # Archive-once-built: load the FULL versions.json so Docusaurus knows about
        # all versions for the dropdown, but we'll override onlyIncludeVersions below
        # to only actually build the latest + new version.
        if [ -f "${{ github.workspace }}/versions.json" ]; then
          cp "${{ github.workspace }}/versions.json" ./
          echo "Imported existing versions.json"
        fi

        echo "Versioning artifacts import completed"

    - name: Generate API docs
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        echo "Generating API docs in parallel..."
        PIDS=()

        if [ -f "static/llama-stack-spec.yaml" ]; then
          npm run gen-api-docs stable &
          PIDS+=($!)
        fi

        if [ -f "static/experimental-llama-stack-spec.yaml" ]; then
          npm run gen-api-docs experimental &
          PIDS+=($!)
        fi

        if [ -f "static/deprecated-llama-stack-spec.yaml" ]; then
          npm run gen-api-docs deprecated &
          PIDS+=($!)
        fi

        for pid in "${PIDS[@]}"; do
          if ! wait $pid; then
            echo "API docs generation failed (PID: $pid)"
            exit 1
          fi
        done

        echo "API docs generation completed"

    - name: Create version snapshot
      if: env.BUILDING_LATEST != 'true'
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        echo "Creating Docusaurus version: ${{ env.VERSION_TAG }}"
        npx docusaurus docs:version "${{ env.VERSION_TAG }}"
        echo "Version ${{ env.VERSION_TAG }} created"

    - name: Inline raw-loader imports in versioned docs
      if: env.BUILDING_LATEST != 'true'
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        echo "Inlining raw-loader imports in versioned docs..."

        if [ -d "versioned_docs" ]; then
          find versioned_docs -name "*.mdx" -type f \
            -exec grep -l "!!raw-loader!" {} \; | \
            while read file; do
              echo "Inlining raw-loader imports in $file"
              python3 << 'PYEOF'
import re, os, sys

file_path = os.environ.get('file', '')
if not file_path:
    # Fall back to inline variable
    file_path = "$file"

with open(file_path, 'r') as f:
    content = f.read()

pattern = r"import\s+(\w+)\s+from\s+'!!raw-loader!([^']+)';\s*\n"
imports = re.findall(pattern, content)

if not imports:
    sys.exit(0)

temp_dir = os.environ.get('TEMP_DIR', '/tmp')
repo_root = f'{temp_dir}/llama-stack'

for var_name, file_ref in imports:
    # Resolve the referenced file
    candidates = [
        os.path.normpath(os.path.join(os.path.dirname(file_path), file_ref)),
        os.path.join(repo_root, os.path.basename(file_ref)),
    ]
    if '../' in file_ref:
        parts = file_ref.split('/')
        remaining = '/'.join(p for p in parts if p != '..')
        candidates.append(os.path.join(repo_root, remaining))

    imported_content = None
    for candidate in candidates:
        if os.path.exists(candidate):
            with open(candidate, 'r') as f:
                imported_content = f.read()
            break

    if imported_content is None:
        print(f'  WARNING: Could not resolve {file_ref}')
        continue

    # Remove imports
    content = re.sub(
        r"import\s+" + var_name + r"\s+from\s+'!!raw-loader![^']+';[ \t]*\n",
        '', content
    )
    content = re.sub(
        r"import\s+ReactMarkdown\s+from\s+'react-markdown';[ \t]*\n",
        '', content
    )

    # Convert RST admonitions to Docusaurus
    imported_content = re.sub(r'```\{note\}', ':::note', imported_content)
    imported_content = re.sub(r'```\{caution\}', ':::caution', imported_content)
    imported_content = re.sub(r'```\{tip\}', ':::tip', imported_content)
    imported_content = re.sub(r'```\{warning\}', ':::warning', imported_content)
    imported_content = re.sub(
        r'(:::(?:note|caution|tip|warning)\n(?:(?!```).)*?\n)```',
        r'\1:::', imported_content, flags=re.DOTALL
    )

    # Fix relative links
    imported_content = imported_content.replace(
        '](tests/README.md)',
        '](https://github.com/llamastack/llama-stack/blob/main/tests/README.md)'
    )
    imported_content = imported_content.replace(
        '](./RELEASE_PROCESS.md)',
        '](https://github.com/llamastack/llama-stack/blob/main/RELEASE_PROCESS.md)'
    )
    imported_content = imported_content.replace(
        '](README.md)',
        '](https://github.com/llamastack/llama-stack#community)'
    )

    content = re.sub(
        r'<ReactMarkdown>\{' + var_name + r'\}</ReactMarkdown>',
        imported_content, content
    )

with open(file_path, 'w') as f:
    f.write(content)
print(f'  Inlined imports in {file_path}')
PYEOF
            done

          echo "Raw-loader imports inlined"
        fi
      env:
        TEMP_DIR: ${{ env.TEMP_DIR }}

    - name: Build Docusaurus site
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Archive-once-built: configure Docusaurus to only build "current" version
        # (and the new tagged version if applicable). All older versions are pre-built
        # static files that get copied directly to the deployment.
        echo "Patching config for archive-once-built (only build current version)..."
        node << 'ARCHEOF'
        const fs = require('fs');
        let config = fs.readFileSync('docusaurus.config.ts', 'utf8');

        // Read the full versions list for dropdown display
        let allVersions = [];
        try {
          allVersions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
        } catch(e) {}

        // For the build, we only want to compile the "current" docs
        // and optionally the new tagged version. Older versions are pre-built.
        const buildingLatest = process.env.BUILDING_LATEST === 'true';
        const versionTag = process.env.VERSION_TAG || 'latest';

        if (allVersions.length > 0) {
          // Build only "current" + the new version being built (if any)
          const onlyInclude = ['current'];
          if (!buildingLatest) {
            onlyInclude.push(versionTag);
          }

          // Add onlyIncludeVersions to the docs plugin config
          // Find the docs config section and add the constraint
          config = config.replace(
            /(docs:\s*\{[^}]*sidebarPath)/,
            `docs: {\n            onlyIncludeVersions: ${JSON.stringify(onlyInclude)},\n            sidebarPath`
          );
          console.log(`Archive-once-built: only building versions ${JSON.stringify(onlyInclude)}`);
        }

        fs.writeFileSync('docusaurus.config.ts', config);
        ARCHEOF

        # Patch out duplicate version badges from OpenAPI MDX files
        find . -name "llama-stack-specification.info.mdx" -type f -exec sed -i '' '/<span$/,/<\/span>$/d' {} \; 2>/dev/null || true

        echo "Running Docusaurus build..."
        npm run build

        echo "Docusaurus build completed"
      env:
        NODE_OPTIONS: "--max-old-space-size=10240"
        BUILDING_LATEST: ${{ env.BUILDING_LATEST }}
        VERSION_TAG: ${{ env.VERSION_TAG }}

    - name: Deploy to GitHub Pages
      run: |
        DOCS_DIR="${{ github.workspace }}/docs"

        # Clear deployment dir (except .git and .nojekyll)
        find "$DOCS_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.nojekyll' -exec rm -rf {} +

        # Copy Docusaurus build output
        cp -r "${{ env.TEMP_DIR }}/llama-stack/docs/build/"* "$DOCS_DIR/"

        # Ensure .nojekyll exists
        touch "$DOCS_DIR/.nojekyll"

        echo "Docusaurus content deployed"

    - name: Update workspace artifacts
      if: env.BUILDING_LATEST != 'true'
      run: |
        echo "Updating workspace versioning artifacts..."

        BUILD_PATH="${{ env.TEMP_DIR }}/llama-stack/docs"

        # Copy versioned docs and sidebars to workspace (for git commit)
        if [ -d "$BUILD_PATH/versioned_docs" ]; then
          cp -r "$BUILD_PATH/versioned_docs" "${{ github.workspace }}/"
          echo "Copied versioned_docs to workspace"
        fi

        if [ -d "$BUILD_PATH/versioned_sidebars" ]; then
          cp -r "$BUILD_PATH/versioned_sidebars" "${{ github.workspace }}/"
          echo "Copied versioned_sidebars to workspace"
        fi

        # Copy updated versions.json to workspace
        cp "$BUILD_PATH/versions.json" "${{ github.workspace }}/"
        echo "Updated workspace versions.json"

    - name: Setup versioning files in deployed site
      run: |
        BUILD_PATH="${{ env.TEMP_DIR }}/llama-stack/docs"
        cp "$BUILD_PATH/versionsArchived.json" "${{ github.workspace }}/docs/"
        cp "$BUILD_PATH/versions.json" "${{ github.workspace }}/docs/"
        echo "Versioning files deployed"

    - name: Commit versioning artifacts
      if: env.BUILDING_LATEST != 'true'
      run: |
        cd "${{ github.workspace }}"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Add versioning artifacts
        git add versioned_docs/ versioned_sidebars/ versions.json 2>/dev/null || true

        # Commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Add Docusaurus version ${{ env.VERSION_TAG }}"
          git push
          echo "Changes committed and pushed"
        else
          echo "No changes to commit"
        fi

    - name: Setup GitHub Pages
      if: ${{ github.event.inputs.action == 'build-and-deploy' }}
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: ${{ github.event.inputs.action == 'build-and-deploy' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

  deploy:
    if: ${{ github.event.inputs.action == 'build-and-deploy' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-only:
    if: ${{ github.event.inputs.action == 'deploy-only' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
