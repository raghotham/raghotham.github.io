name: Build and Deploy Docusaurus Documentation

# This workflow builds and deploys documentation for llamastack.github.io
#
# Triggers:
# 1. Nightly build: Runs daily at 1 AM UTC (1 hour after llama-stack nightly build)
# 2. Manual: Can be triggered manually with version and action options
#
# Performance optimizations:
# 1. For 'latest' builds: Downloads pre-built docs from llama-stack nightly job (if available)
#    - Skips time-consuming API documentation generation
#    - PR #4911 for nightly docmentation build got merged in llama-stack repo
# 2. Content change detection: Skips rebuild if docs content hasn't changed
# 3. Multi-level caching: API docs, node_modules, and build artifacts
# 4. Parallel API docs generation: Generates stable/experimental/deprecated docs concurrently

on:
  schedule:
    # Run daily at 1 AM UTC (1 hour after llama-stack nightly build at 12 AM UTC)
    # This timing ensures pre-built artifacts are available
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (latest, v0.2.23, etc.)'
        required: false
        default: 'latest'
        type: string
      action:
        description: 'Action to perform'
        required: false
        default: 'build-and-deploy'
        type: choice
        options:
          - build-only
          - deploy-only
          - build-and-deploy

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # Run if: (1) scheduled trigger, (2) manual trigger with action != 'deploy-only'
    if: ${{ github.event_name == 'schedule' || github.event.inputs.action != 'deploy-only' }}
    runs-on: ubuntu-latest

    steps:
    - name: Workflow trigger information
      run: |
        echo "Workflow Trigger Information"
        echo "═══════════════════════════════════════════════════════"
        echo "Trigger type: ${{ github.event_name }}"

        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "Mode: Nightly automated build"
          echo "Version: latest (default)"
          echo "Action: build-and-deploy (default)"
        else
          echo "Mode: Manual trigger"
          echo "Version: ${{ github.event.inputs.version || 'latest' }}"
          echo "Action: ${{ github.event.inputs.action || 'build-and-deploy' }}"
        fi
        echo "═══════════════════════════════════════════════════════"

    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clone llama-stack repository
      run: |
        echo "📥 Cloning llama-stack repository..."
        TEMP_DIR=$(mktemp -d)
        echo "TEMP_DIR=$TEMP_DIR" >> $GITHUB_ENV

        git clone https://github.com/llamastack/llama-stack.git "$TEMP_DIR/llama-stack"
        cd "$TEMP_DIR/llama-stack"
        git fetch --all --tags

        # Determine version to checkout
        # Use 'latest' as default for scheduled builds (github.event.inputs.version will be empty)
        VERSION="${{ github.event.inputs.version || 'latest' }}"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          git checkout main
          echo "✅ Using main branch (latest)"
          echo "BUILDING_LATEST=true" >> $GITHUB_ENV
          echo "VERSION_TAG=latest" >> $GITHUB_ENV
        else
          git checkout "$VERSION"
          echo "✅ Using tag: $VERSION"
          echo "BUILDING_LATEST=false" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV
          # Version builds always need full build (no pre-built artifacts)
          echo "PREBUILT_AVAILABLE=false" >> $GITHUB_ENV
        fi

    - name: Download pre-built docs from llama-stack nightly job
      id: download-artifacts
      continue-on-error: true
      if: ${{ env.BUILDING_LATEST == 'true' }}
      run: |
        echo "⚡ Attempting to download pre-built docs from llama-stack repository..."

        # Try to download the latest nightly build artifact
        # Uses gh CLI to download the latest docs-build artifact from the main branch
        if gh run download --repo llamastack/llama-stack --name docs-build --dir "${{ env.TEMP_DIR }}/prebuilt-docs" 2>/dev/null; then
          echo "✅ Successfully downloaded pre-built docs"
          echo "PREBUILT_AVAILABLE=true" >> $GITHUB_ENV

          # Verify the download contains the expected structure
          if [ -f "${{ env.TEMP_DIR }}/prebuilt-docs/index.html" ]; then
            echo "✅ Pre-built docs verified"
            ls -la "${{ env.TEMP_DIR }}/prebuilt-docs/" | head -10
          else
            echo "⚠️ Pre-built docs structure unexpected, will fall back to full build"
            echo "PREBUILT_AVAILABLE=false" >> $GITHUB_ENV
          fi
        else
          echo "ℹ️ No pre-built docs available, will perform full build"
          echo "PREBUILT_AVAILABLE=false" >> $GITHUB_ENV
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup caching for build artifacts
      uses: actions/cache@v4
      id: cache-npm
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('${{ env.TEMP_DIR }}/llama-stack/docs/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install dependencies and setup versioning
      run: |
        echo "📦 Installing dependencies..."
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"
        npm ci
        echo "✅ Dependencies installed"

        echo "⚙️ Setting up versioning configuration..."

        # Copy persistent versionsArchived.json from repo
        cp "${{ github.workspace }}/versionsArchived.json" ./

        # Load existing versions.json from deployed site or create empty
        if [ -f "${{ github.workspace }}/docs/versions.json" ]; then
          # If we're building a specific version, exclude it from the imported versions.json
          if [ "${{ env.BUILDING_LATEST }}" != "true" ]; then
            # Filter out the version we're about to build
            node -e "
            const versions = JSON.parse(require('fs').readFileSync('${{ github.workspace }}/docs/versions.json', 'utf8'));
            const filtered = versions.filter(v => v !== '${{ env.VERSION_TAG }}');
            require('fs').writeFileSync('versions.json', JSON.stringify(filtered, null, 2));
            console.log('✅ Loaded versions.json (filtered out ${{ env.VERSION_TAG }})');
            "
          else
            cp "${{ github.workspace }}/docs/versions.json" ./
            echo "✅ Loaded existing versions.json"
          fi
        else
          echo "[]" > versions.json
          echo "✅ Created empty versions.json"
        fi

        # Patch Docusaurus config for versioning
        node << 'EOF'
        const fs = require('fs');

        let config = fs.readFileSync('docusaurus.config.ts', 'utf8');

        // Add versioning imports after OpenAPI import
        const versioningImports = `
        // Import fs for versioning configuration
        const fs = require('fs');

        // Versioning configuration for llamastack.github.io
        const versionsArchived = (() => {
          try {
            return JSON.parse(fs.readFileSync('./versionsArchived.json', 'utf8'));
          } catch (e) {
            console.warn('Could not load versionsArchived.json:', e);
            return {};
          }
        })();

        const archivedVersionsDropdownItems = Object.entries(versionsArchived).map(
          ([versionName, versionUrl]) => ({
            label: versionName,
            href: versionUrl,
          })
        );
        `;

        config = config.replace(
          /import type \* as OpenApiPlugin from "docusaurus-plugin-openapi-docs";/,
          `import type * as OpenApiPlugin from "docusaurus-plugin-openapi-docs";

        ${versioningImports}`
        );

        // Add version dropdown to navbar (replace GitHub item)
        const versionDropdown = `        {
          href: 'https://github.com/llamastack/llama-stack',
          label: 'GitHub',
          position: 'right',
        },
        {
          type: 'docsVersionDropdown',
          position: 'right',
          dropdownItemsAfter: archivedVersionsDropdownItems.length > 0 ? [
            {
              type: 'html',
              value: '<hr class="dropdown-separator">',
            },
            {
              type: 'html',
              className: 'dropdown-archived-versions',
              value: '<b>Previous versions</b>',
            },
            ...archivedVersionsDropdownItems,
          ] : [],
        },`;

        config = config.replace(
          /\s*{\s*href:\s*'https:\/\/github\.com\/llamastack\/llama-stack',\s*label:\s*'GitHub',\s*position:\s*'right',\s*},/,
          versionDropdown
        );

        fs.writeFileSync('docusaurus.config.ts', config);
        console.log('✅ Configuration patched');
        EOF

        echo "✅ Configuration patches applied"

    - name: Import existing versioning artifacts
      run: |
        echo "📥 Importing existing versioning artifacts from repository..."
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Copy existing versioned_docs if they exist
        if [ -d "${{ github.workspace }}/versioned_docs" ]; then
          cp -r "${{ github.workspace }}/versioned_docs" ./
          echo "✅ Imported existing versioned_docs"
        else
          echo "ℹ️ No existing versioned_docs found (first version)"
        fi

        # Copy existing versioned_sidebars if they exist
        if [ -d "${{ github.workspace }}/versioned_sidebars" ]; then
          cp -r "${{ github.workspace }}/versioned_sidebars" ./
          echo "✅ Imported existing versioned_sidebars"
        else
          echo "ℹ️ No existing versioned_sidebars found (first version)"
        fi

        # Copy existing versions.json if it exists (overrides what we loaded earlier)
        if [ -f "${{ github.workspace }}/versions.json" ]; then
          cp "${{ github.workspace }}/versions.json" ./
          echo "✅ Imported existing versions.json"
        else
          echo "ℹ️ No existing versions.json found (first version)"
        fi

        echo "✅ Versioning artifacts import completed"

    - name: Check for content changes (optimization)
      id: content-changes
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Create hash of all documentation content
        CONTENT_HASH=$(find docs static -type f \( -name "*.md" -o -name "*.mdx" -o -name "*.yaml" -o -name "*.json" \) -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
        echo "CONTENT_HASH=$CONTENT_HASH" >> $GITHUB_OUTPUT
        echo "📊 Content hash: $CONTENT_HASH"

        # For latest builds, check if content has changed since last deployment
        if [ "${{ env.BUILDING_LATEST }}" = "true" ]; then
          # Try to get the last deployment hash from the deployed site
          LAST_HASH=""
          if curl -s "https://llamastack.github.io/content-hash.txt" > /tmp/last_hash.txt 2>/dev/null; then
            LAST_HASH=$(cat /tmp/last_hash.txt)
            echo "📊 Previous hash: $LAST_HASH"
          fi

          if [ "$CONTENT_HASH" = "$LAST_HASH" ] && [ -n "$LAST_HASH" ]; then
            echo "✅ Content unchanged since last deployment"
            echo "CONTENT_CHANGED=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Content has changed since last deployment"
            echo "CONTENT_CHANGED=true" >> $GITHUB_OUTPUT
          fi
        else
          # For version builds, always process (new version)
          echo "🔄 Building version ${{ env.VERSION_TAG }}"
          echo "CONTENT_CHANGED=true" >> $GITHUB_OUTPUT
        fi

    - name: Cache stable API docs
      uses: actions/cache@v4
      id: cache-api-stable
      with:
        path: ${{ env.TEMP_DIR }}/llama-stack/docs/docs/api
        key: api-stable-${{ env.VERSION_TAG }}-${{ hashFiles('${{ env.TEMP_DIR }}/llama-stack/docs/static/llama-stack-spec.yaml') }}
        restore-keys: |
          api-stable-${{ env.VERSION_TAG }}-
          api-stable-

    - name: Cache experimental API docs
      uses: actions/cache@v4
      id: cache-api-experimental
      with:
        path: ${{ env.TEMP_DIR }}/llama-stack/docs/docs/api-experimental
        key: api-experimental-${{ env.VERSION_TAG }}-${{ hashFiles('${{ env.TEMP_DIR }}/llama-stack/docs/static/experimental-llama-stack-spec.yaml') }}
        restore-keys: |
          api-experimental-${{ env.VERSION_TAG }}-
          api-experimental-

    - name: Cache deprecated API docs
      uses: actions/cache@v4
      id: cache-api-deprecated
      with:
        path: ${{ env.TEMP_DIR }}/llama-stack/docs/docs/api-deprecated
        key: api-deprecated-${{ env.VERSION_TAG }}-${{ hashFiles('${{ env.TEMP_DIR }}/llama-stack/docs/static/deprecated-llama-stack-spec.yaml') }}
        restore-keys: |
          api-deprecated-${{ env.VERSION_TAG }}-
          api-deprecated-

    - name: Cache Docusaurus build artifacts
      uses: actions/cache@v4
      id: cache-docusaurus-build
      with:
        path: |
          ${{ env.TEMP_DIR }}/llama-stack/docs/.docusaurus
          ${{ env.TEMP_DIR }}/llama-stack/docs/build
        key: docusaurus-build-${{ env.VERSION_TAG }}-${{ hashFiles('${{ env.TEMP_DIR }}/llama-stack/docs/docs/**/*.{md,mdx}', '${{ env.TEMP_DIR }}/llama-stack/docs/static/**/*', '${{ env.TEMP_DIR }}/llama-stack/docs/docusaurus.config.ts', '${{ env.TEMP_DIR }}/llama-stack/docs/package.json') }}
        restore-keys: |
          docusaurus-build-${{ env.VERSION_TAG }}-
          docusaurus-build-

    - name: Build documentation
      # Skip if content hasn't changed (latest builds only)
      if: ${{ steps.content-changes.outputs.CONTENT_CHANGED == 'true' }}
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Check if we can use pre-built docs
        if [ "${{ env.PREBUILT_AVAILABLE }}" = "true" ]; then
          echo "⚡ Using pre-built docs from llama-stack nightly job (skipping API docs generation)"
          echo "  This saves significant build time by reusing pre-generated documentation"

          # Copy pre-built docs directly
          # Note: Pre-built docs already include generated API documentation
          echo "  📋 Pre-built docs will be used in the build step"
        else
          # Generate API docs in parallel for better performance
          echo "🔄 Generating API docs in parallel..."

          # Start background processes for each API docs generation
          PIDS=()

          # Generate stable API docs if not cached
          if [ "${{ steps.cache-api-stable.outputs.cache-hit }}" != 'true' ]; then
            echo "  📄 Starting stable API docs generation (cache miss)..."
            npm run gen-api-docs stable &
            STABLE_PID=$!
            PIDS+=($STABLE_PID)
            echo "  🔄 Stable API docs generation started (PID: $STABLE_PID)"
          else
            echo "  ⚡ Using cached stable API docs"
          fi

          # Generate experimental API docs if not cached
          if [ "${{ steps.cache-api-experimental.outputs.cache-hit }}" != 'true' ]; then
            echo "  📄 Starting experimental API docs generation (cache miss)..."
            npm run gen-api-docs experimental &
            EXPERIMENTAL_PID=$!
            PIDS+=($EXPERIMENTAL_PID)
            echo "  🔄 Experimental API docs generation started (PID: $EXPERIMENTAL_PID)"
          else
            echo "  ⚡ Using cached experimental API docs"
          fi

          # Generate deprecated API docs if not cached
          if [ "${{ steps.cache-api-deprecated.outputs.cache-hit }}" != 'true' ]; then
            echo "  📄 Starting deprecated API docs generation (cache miss)..."
            npm run gen-api-docs deprecated &
            DEPRECATED_PID=$!
            PIDS+=($DEPRECATED_PID)
            echo "  🔄 Deprecated API docs generation started (PID: $DEPRECATED_PID)"
          else
            echo "  ⚡ Using cached deprecated API docs"
          fi

          # Wait for all parallel processes to complete
          if [ ${#PIDS[@]} -gt 0 ]; then
            echo "  ⏳ Waiting for ${#PIDS[@]} API docs generation processes to complete..."
            for pid in "${PIDS[@]}"; do
              echo "    ⏳ Waiting for process $pid..."
              if wait $pid; then
                echo "    ✅ Process $pid completed successfully"
              else
                echo "    ❌ Process $pid failed"
                exit 1
              fi
            done
          fi

          echo "✅ API docs generation completed"
        fi

        # Create version if not latest (after content is ready)
        if [ "${{ env.BUILDING_LATEST }}" != "true" ]; then
          echo "📚 Creating Docusaurus version: ${{ env.VERSION_TAG }}"

          # Create the version snapshot
          npx docusaurus docs:version "${{ env.VERSION_TAG }}"

          # Ensure prompt-format.png is available where versioned docs expect it
          mkdir -p versioned_docs/resources
          if [ ! -f "versioned_docs/resources/prompt-format.png" ]; then
            echo "📥 Downloading missing prompt-format.png..."
            curl -o versioned_docs/resources/prompt-format.png https://raw.githubusercontent.com/llamastack/llama-stack/main/docs/static/img/prompt-format.png
            echo "✅ Downloaded prompt-format.png to versioned_docs/resources/"
          else
            echo "✅ prompt-format.png already exists in versioned_docs/resources/"
          fi

          echo "✅ Version ${{ env.VERSION_TAG }} created"
        else
          echo "🏗️ Building latest version (no version snapshot needed)"
        fi

    - name: Fix versioned docs relative imports
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        echo "🔧 Fixing relative imports in versioned docs..."

        if [ -d "versioned_docs" ]; then
          # Fix relative paths (../../../file.md -> absolute path)
          find versioned_docs -name "*.mdx" -type f \
            -exec grep -l "!!raw-loader!\.\." {} \; | \
            while read file; do
              echo "Fixing relative raw-loader imports in $file"
              # Pattern: !!raw-loader! followed by any number of ../ then a filename
              # Replace with absolute path to repo root + filename
              perl -i -pe "s|!!raw-loader!(\.\.\/)+([^'\"]*)|!!raw-loader!${{ env.TEMP_DIR }}/llama-stack/\$2|g" "$file"
            done

          # Fix hardcoded old temp paths (/tmp/tmp.XXXXXX/llama-stack/file.md -> current temp path)
          find versioned_docs -name "*.mdx" -type f \
            -exec grep -l "!!raw-loader!/tmp/tmp\." {} \; | \
            while read file; do
              echo "Fixing hardcoded temp path imports in $file"
              # Pattern: !!raw-loader!/tmp/tmp.XXXXXX/llama-stack/filename
              # Replace with current temp directory path
              perl -i -pe "s|!!raw-loader!/tmp/tmp\.[^/]+/llama-stack/([^'\"]*)|!!raw-loader!${{ env.TEMP_DIR }}/llama-stack/\$1|g" "$file"
            done

          echo "✅ Versioned docs import paths corrected"
        else
          echo "ℹ️ No versioned docs found"
        fi

    - name: Build Docusaurus site
      # Skip if content hasn't changed (latest builds only)
      if: ${{ steps.content-changes.outputs.CONTENT_CHANGED == 'true' }}
      run: |
        cd "${{ env.TEMP_DIR }}/llama-stack/docs"

        # Check if we can use pre-built docs directly
        if [ "${{ env.PREBUILT_AVAILABLE }}" = "true" ]; then
          echo "⚡ Using pre-built Docusaurus site from llama-stack nightly job"

          # Copy pre-built site directly (prebuilt-docs already contains build/ contents)
          mkdir -p build
          cp -r "${{ env.TEMP_DIR }}/prebuilt-docs/"* build/
          echo "✅ Pre-built site copied successfully"

          # Verify the build is valid
          if [ -f "build/index.html" ] && [ -d "build/assets" ]; then
            echo "✅ Pre-built site verified and ready to deploy"
          else
            echo "⚠️ Pre-built site validation failed, falling back to full build..."
            rm -rf build/
            FORCE_BUILD=true
          fi
        # Check if we can skip build due to cache hit
        elif [ "${{ steps.cache-docusaurus-build.outputs.cache-hit }}" = 'true' ]; then
          echo "⚡ Using cached Docusaurus build (cache hit)"

          # Verify build output exists and is valid
          if [ -f "build/index.html" ] && [ -d "build/assets" ]; then
            echo "✅ Cached build is valid, skipping build step"
          else
            echo "⚠️ Cache hit but build output missing/invalid, rebuilding..."
            FORCE_BUILD=true
          fi
        else
          echo "🔄 Building Docusaurus site (cache miss)..."
          FORCE_BUILD=true
        fi

        if [ "${FORCE_BUILD:-false}" = 'true' ]; then
          # Patch out duplicate version badges from OpenAPI MDX files
          echo "🔧 Patching out duplicate version badges..."
          find . -name "llama-stack-specification.info.mdx" -type f -exec sed -i '/<span$/,/<\/span>$/d' {} \;

          echo "🏗️ Running Docusaurus build..."
          npm run build
        fi

        echo "✅ Docusaurus build completed"
      env:
        NODE_OPTIONS: "--max-old-space-size=10240"

    - name: Build summary
      run: |
        echo "📊 Build Summary"
        echo "═══════════════════════════════════════════════════════"

        if [ "${{ env.PREBUILT_AVAILABLE }}" = "true" ]; then
          echo "⚡ Optimization: Used pre-built docs from llama-stack nightly job"
          echo "   ✓ Skipped API documentation generation"
          echo "   ✓ Skipped Docusaurus build"
          echo "   ✓ Significant time savings achieved"
        elif [ "${{ steps.content-changes.outputs.CONTENT_CHANGED }}" = 'false' ]; then
          echo "⚡ Optimization: No content changes detected"
          echo "   ✓ Skipped build steps"
        else
          echo "🔄 Full build performed"
          if [ "${{ steps.cache-api-stable.outputs.cache-hit }}" = "true" ]; then
            echo "   ✓ Used cached stable API docs"
          fi
          if [ "${{ steps.cache-api-experimental.outputs.cache-hit }}" = "true" ]; then
            echo "   ✓ Used cached experimental API docs"
          fi
          if [ "${{ steps.cache-api-deprecated.outputs.cache-hit }}" = "true" ]; then
            echo "   ✓ Used cached deprecated API docs"
          fi
        fi

        echo "═══════════════════════════════════════════════════════"

    - name: Deploy to GitHub Pages
      run: |
        if [ "${{ steps.content-changes.outputs.CONTENT_CHANGED }}" = 'false' ]; then
          echo "⚡ Deploying cached build (no content changes detected)"
        else
          echo "🗂️ Deploying fresh Docusaurus build..."
        fi

        DOCS_DIR="${{ github.workspace }}/docs"

        # Handle deployment based on whether content changed
        if [ "${{ steps.content-changes.outputs.CONTENT_CHANGED }}" = 'true' ]; then
          # Fresh build - deploy new content
          # Smart deployment: clear everything except .git, .nojekyll, and archived versions
          find "$DOCS_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.nojekyll' ! -name 'v[0-9]*' -exec rm -rf {} +

          # Copy Docusaurus build output
          cp -r "${{ env.TEMP_DIR }}/llama-stack/docs/build/"* "$DOCS_DIR/"
        else
          # No content changes - keep existing deployment, just update metadata
          echo "📂 Keeping existing deployment (content unchanged)"
        fi

        # Ensure .nojekyll exists
        touch "$DOCS_DIR/.nojekyll"

        # Save content hash for future optimization checks
        if [ -n "${{ steps.content-changes.outputs.CONTENT_HASH }}" ]; then
          echo "${{ steps.content-changes.outputs.CONTENT_HASH }}" > "$DOCS_DIR/content-hash.txt"
          echo "💾 Saved content hash for future builds"
        fi

        echo "✅ Docusaurus content deployed"

    - name: Update workspace artifacts
      if: env.BUILDING_LATEST != 'true'
      run: |
        echo "📋 Updating workspace versioning artifacts..."

        BUILD_PATH="${{ env.TEMP_DIR }}/llama-stack/docs"

        # Copy versioned docs and sidebars to workspace (for git commit)
        if [ -d "$BUILD_PATH/versioned_docs" ]; then
          cp -r "$BUILD_PATH/versioned_docs" "${{ github.workspace }}/"
          echo "✅ Copied versioned_docs to workspace"
        fi

        if [ -d "$BUILD_PATH/versioned_sidebars" ]; then
          cp -r "$BUILD_PATH/versioned_sidebars" "${{ github.workspace }}/"
          echo "✅ Copied versioned_sidebars to workspace"
        fi

        # Copy updated versions.json to workspace
        cp "$BUILD_PATH/versions.json" "${{ github.workspace }}/"
        echo "✅ Updated workspace versions.json"

    - name: Setup versioning files in deployed site
      run: |
        echo "⚙️ Setting up versioning configuration files..."

        BUILD_PATH="${{ env.TEMP_DIR }}/llama-stack/docs"

        # Copy versioning files to deployment
        cp "$BUILD_PATH/versionsArchived.json" "${{ github.workspace }}/docs/"
        cp "$BUILD_PATH/versions.json" "${{ github.workspace }}/docs/"

        echo "✅ Versioning files created"

    - name: Verify deployment structure
      run: |
        echo "🔍 Verifying deployment structure..."

        echo "Contents of docs directory:"
        ls -la "${{ github.workspace }}/docs/" | head -10

        echo -e "\nVersioning files:"
        [ -f "${{ github.workspace }}/docs/versionsArchived.json" ] && echo "✅ versionsArchived.json exists" || echo "❌ versionsArchived.json missing"
        [ -f "${{ github.workspace }}/docs/versions.json" ] && echo "✅ versions.json exists" || echo "❌ versions.json missing"

        echo -e "\n✅ Structure verification complete"

    - name: Commit versioning artifacts
      if: env.BUILDING_LATEST != 'true'
      run: |
        echo "💾 Committing versioning artifacts..."

        cd "${{ github.workspace }}"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Add versioning artifacts
        git add versioned_docs/ versioned_sidebars/ versions.json 2>/dev/null || true

        # Commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Add Docusaurus version ${{ env.VERSION_TAG }}

          - Created version snapshot in versioned_docs/version-${{ env.VERSION_TAG }}/
          - Updated versions.json with new version
          - Built and deployed multi-version site

          🤖 Generated by Docusaurus versioning workflow"

          git push
          echo "✅ Changes committed and pushed"
        else
          echo "ℹ️ No changes to commit"
        fi

    - name: Setup GitHub Pages
      if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'build-and-deploy' }}
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'build-and-deploy' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

  deploy:
    # Deploy for: (1) scheduled builds, (2) manual builds with action == 'build-and-deploy'
    if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'build-and-deploy' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-only:
    if: ${{ github.event.inputs.action == 'deploy-only' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
